target-version = "py310"
line-length = 100
extend-exclude = [".GCC", ".modelisation", "ui-specifications", "frontend", ".github"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = ["B008"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
