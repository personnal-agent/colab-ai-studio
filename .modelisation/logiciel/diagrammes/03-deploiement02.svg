  <rect x="1555" y="245" width="540" height="680" rx="5" fill="#FAFDFB" stroke="#166534" stroke-width="1.4"/>
  <text x="1570" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">«artifact» colab_worker/server.py &amp; model_swapper.py</text>
  <text x="1570" y="295" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Dynamic Model Swapper (gestion de cache LRU en VRAM / HBM)</text>
  <text x="1570" y="315" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Support Matériel GPU NVIDIA : T4 (16 Go), L4 (24 Go), A100 (40/80 Go)</text>
  <text x="1570" y="335" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Support Matériel TPU Google : TPU v5e, TPU v6e, TPU v2-8 (torch_xla)</text>
  <text x="1570" y="355" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Pipelines Diffusers Image : SDXL, Flux.1, SD1.5 (t2i, i2i, inpainting)</text>
  <text x="1570" y="375" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Pipelines Vidéo : Wan2.1, HunyuanVideo, CogVideoX (sortie .mp4 720p/1080p)</text>
  <text x="1570" y="395" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Pipelines Audio &amp; Voix : Kokoro-82M, Chatterbox TTS (.wav)</text>
  <text x="1570" y="415" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Pipelines Lip-sync : SadTalker, Wav2Lip (synchronisation labiale avatar)</text>
  <text x="1570" y="435" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Modèles 3D Mesh : TripoSR, SV3D, CRM (sortie format 3D .glb / .obj)</text>
  <text x="1570" y="455" font-family="Arial, sans-serif" font-size="11" fill="#17212B">• Tunnel public chiffré TLS automatique (sans configuration manuelle ngrok)</text>
  <text x="1570" y="475" font-family="Arial, sans-serif" font-size="11" fill="#334155">• PID: 1142 · Écoute: 0.0.0.0:8000</text>
  <text x="1570" y="495" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#166534">• Déport total de la charge GPU : Zéro surchauffe ni crash mémoire sur le PC hôte</text>

