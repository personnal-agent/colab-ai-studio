  <text x="48" y="68" font-family="Arial, sans-serif" font-size="13.5" fill="#52616B">Diagramme de Déploiement UML 2.5.1 · Nœuds 3D Axonométriques «device», Ligne Continue «communicationPath», PIDs illustratifs &amp; Nomenclature Formelle des Ports</text>
  <line x1="48" y1="82" x2="2172" y2="82" stroke="#D5DEE5" stroke-width="1.5"/>

