<path d="M1693 1095 L587 1095" fill="none" stroke="#405364" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
<text x="1140" y="1087" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#17212B">202 Accepted {taskId, status: "queued"}</text>

<!-- 10. Retour du FastAPIBackend vers ReactSPA -->
<path d="M573 1130 L327 1130" fill="none" stroke="#405364" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
<text x="450" y="1122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#17212B">202 Accepted {taskId, compiledBrief}</text>

<!-- 11. Auto-appel de mise à jour UI sur ReactSPA -->
<path d="M327 1155 L365 1155 L365 1175 L337 1175" fill="none" stroke="#405364" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="375" y="1169" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">displayImmediateProgress(taskId)</text>
<text x="375" y="1190" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#596875">→ soumission immédiate · pas d’écran intermédiaire bloquant</text>

<!-- ========================================== -->
<!-- CARTOUCHE DE RÈGLES MÉTIER ET INVARIANTS   -->
<!-- ========================================== -->
<rect x="85" y="1225" width="1690" height="90" rx="4" fill="#FFF8E8" stroke="#8C6418" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="105" y="1250" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#8C6418">RÈGLES D'INVARIANCE MÉTIER &amp; CONTRAT D'ARCHITECTURE :</text>
<text x="105" y="1273" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">1. Loi de Déméter &amp; Symétrie réseau : La SPA React contacte le backend FastAPI. BrandContextCompiler est un service interne de domaine sans accès au réseau distant. Seul FastAPI émet POST /infer vers Colab.</text>
<text x="105" y="1293" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">2. Déterminisme hors-ligne : La lecture de persistance Brand Kit s'exécute toujours en amont afin d'assurer l'injection des tokens même en cas de panne LLM.</text>
<text x="105" y="1313" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">3. Arbitrage de quota d'images : Si userRefs.length &gt; maxImageRefs, les N premières références sont conservées par ordre de dépôt avec avertissement toast avant envoi.</text>

<text x="48" y="1380" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#596875">Colab AI Studio · Compilation du contexte de marque, arbitrage des références visuelles et émission vers Colab</text>
</svg>
