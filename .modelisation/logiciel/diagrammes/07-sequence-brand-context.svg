<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1420" viewBox="0 0 1760 1420">
<defs>
  <!-- Marqueur appel synchrone : flèche à tête triangulaire pleine (OMG UML 2.5.1) -->
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0 0 L10 4 L0 8 Z" fill="#405364"/>
  </marker>
  <!-- Marqueur appel asynchrone et retour : flèche à tête ouverte (OMG UML 2.5.1) -->
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M1 0.8 L9 4 L1 7.2" fill="none" stroke="#405364" stroke-width="1.5"/>
  </marker>
</defs>

<!-- Fond d'écran blanc pur -->
<rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>

<!-- ========================================== -->
<!-- EN-TÊTE ET CARTOUCHE NORMATIF OMG UML      -->
<!-- ========================================== -->
<rect x="48" y="24" width="370" height="32" rx="0" fill="#EDF5F6" stroke="#126A78" stroke-width="1.5"/>
<text x="60" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#126A78">sd</text>
<text x="90" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#17212B">Compilation et Injection Contexte Marque</text>

<text x="48" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17212B">07 · Diagramme de Séquence — Compilation de Marque &amp; Arbitrage Références</text>
<text x="50" y="104" font-family="Arial, sans-serif" font-size="13" fill="#596875">Conformité OMG UML 2.5.1 &amp; L3 MIAGE · Chargement persistance amont, repli LLM déterministe, auto-appels U-shape et chaîne de réponse symétrique</text>
<line x1="48" y1="118" x2="1712" y2="118" stroke="#D8E0E5" stroke-width="1.5"/>

<!-- ========================================== -->
<!-- PARTICIPANTS ET LIGNES DE VIE              -->
<!-- ========================================== -->

<!-- 1. Acteur Humain : c : Créateur (x = 120) -->
<circle cx="120" cy="148" r="10" fill="#FFFFFF" stroke="#17212B" stroke-width="2"/>
<line x1="120" y1="158" x2="120" y2="186" stroke="#17212B" stroke-width="2"/>
<line x1="102" y1="168" x2="138" y2="168" stroke="#17212B" stroke-width="2"/>
