<!-- Auto-appel 3 en U-shape normé avec fond blanc protecteur -->
<path d="M867 850 L905 850 L905 870 L877 870" fill="none" stroke="#405364" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="912" y="853" width="310" height="24" fill="#FFFFFF" fill-opacity="0.95" rx="2"/>
<text x="915" y="869" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">allocateReferenceSlots(userRefs, kitRefs, logo)</text>

<!-- Auto-appel 4 en U-shape normé avec fond blanc protecteur -->
<path d="M867 915 L905 915 L905 935 L877 935" fill="none" stroke="#405364" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="912" y="918" width="410" height="42" fill="#FFFFFF" fill-opacity="0.95" rx="2"/>
<text x="915" y="934" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17212B">prioritizeRefs(P1: userRefs, P2: kitRefs, P3: logo)</text>
<text x="915" y="954" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#596875">→ conservation ordonnée dans la limite du quota maxImageRefs</text>

<!-- 7. Retour du compilateur vers le contrôleur FastAPIBackend -->
<path d="M853 1015 L587 1015" fill="none" stroke="#405364" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
<text x="720" y="1007" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#17212B">compiledContext {enrichedPrompt, selectedRefs, modelParams}</text>

<!-- 8. Transmission de la tâche compilée par le Backend au Worker Colab (Loi de Déméter) -->
<path d="M587 1045 L1693 1045" fill="none" stroke="#405364" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1140" y="1037" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#17212B">POST /infer (taskSpec: compiledContext)</text>

