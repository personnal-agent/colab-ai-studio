<line x1="720" y1="191" x2="720" y2="1270" stroke="#405364" stroke-width="1.2" stroke-dasharray="6 6"/>

<!-- 4. Participant : :StorageManager (x = 1010) -->
<rect x="915" y="145" width="190" height="46" rx="3" fill="#EDF5F6" stroke="#405364" stroke-width="1.6"/>
<text x="1010" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#17212B">:StorageManager</text>
<text x="1010" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#596875">data/brand_kits.json</text>
<line x1="1010" y1="191" x2="1010" y2="1270" stroke="#405364" stroke-width="1.2" stroke-dasharray="6 6"/>

