<line x1="790" y1="560" x2="1490" y2="560" stroke="#126A78" stroke-width="1.2" stroke-dasharray="6 4"/>

<!-- Branche 2 : Repli déterministe hors-ligne -->
<text x="805" y="580" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#126A78">[clé absente, timeout, quota dépassé ou mode hors-ligne]</text>

