<text x="410" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#17212B">:FloatingPromptDock</text>
<line x1="410" y1="191" x2="410" y2="1270" stroke="#405364" stroke-width="1.2" stroke-dasharray="6 6"/>

