<!-- 1. Service d'inférence LLM (Local / Cloud) -->
<rect x="1350" y="215" width="210" height="64" rx="4" fill="#FFFFFF" stroke="#17212B" stroke-width="2"/>
<text x="1455" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#596875">«actor»</text>
<text x="1455" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#17212B">Service d'inférence LLM</text>
<text x="1455" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#596875">(Local / Cloud)</text>

<!-- 2. Google Colab (Worker GPU distant) -->
<rect x="1350" y="365" width="210" height="64" rx="4" fill="#FFFFFF" stroke="#17212B" stroke-width="2"/>
<text x="1455" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#596875">«actor»</text>
<text x="1455" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#17212B">Google Colab</text>
<text x="1455" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#596875">(Worker GPU distant)</text>

