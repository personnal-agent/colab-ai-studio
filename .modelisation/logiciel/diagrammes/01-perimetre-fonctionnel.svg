<text x="50" y="930" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#596875">Frontière système : l'application locale pilote le worker distant Google Colab (acteur secondaire externe de calcul GPU).</text>
<text x="48" y="958" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#596875">Colab AI Studio · Architecture hybride : déclenchement par les acteurs locaux et exécution déportée vers les services distants</text>
