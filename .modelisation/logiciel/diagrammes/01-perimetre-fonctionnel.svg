<rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>
<text x="48" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17212B">01 · Périmètre fonctionnel</text>
<text x="50" y="77" font-family="Arial, sans-serif" font-size="15" fill="#596875">Diagramme de cas d’utilisation UML · objectifs observables, acteurs externes et système cible</text>
<line x1="48" y1="96" x2="1552" y2="96" stroke="#D8E0E5" stroke-width="1.5"/>

<!-- Limite du système cible (Application Studio Locale) -->
