<!-- Cas d'utilisation métier (valeur observable) -->
<!-- 1. Produire un média -->
<ellipse cx="530.0" cy="251.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="530.0" y="247.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="530.0" dy="0">Produire un média</tspan><tspan x="530.0" dy="20">image · vidéo · lip sync · upscale</tspan></text>

<!-- 2. Interagir avec l'assistant textuel IA -->
<ellipse cx="950.0" cy="251.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="950.0" y="247.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="950.0" dy="0">Interagir avec l'assistant textuel IA</tspan><tspan x="950.0" dy="20">génération de texte et assistance</tspan></text>

<!-- 3. Suivre une génération -->
<ellipse cx="530.0" cy="401.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="530.0" y="397.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="530.0" dy="0">Suivre une génération</tspan><tspan x="530.0" dy="20">progression temps réel</tspan></text>

<!-- 4. Annuler une génération -->
<ellipse cx="950.0" cy="401.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="950.0" y="397.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="950.0" dy="0">Annuler une génération</tspan><tspan x="950.0" dy="20">tâche en cours</tspan></text>

<!-- 5. Parcourir et remixer -->
<ellipse cx="530.0" cy="551.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="530.0" y="547.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="530.0" dy="0">Parcourir et remixer</tspan><tspan x="530.0" dy="20">favoris · filtres · export</tspan></text>

<!-- 6. Gérer les Brand Kits -->
<ellipse cx="950.0" cy="551.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="950.0" y="547.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="950.0" dy="0">Gérer les Brand Kits</tspan><tspan x="950.0" dy="20">actifs · directives · identité</tspan></text>

<!-- 7. Organiser les projets -->
<ellipse cx="530.0" cy="701.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="530.0" y="697.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="530.0" dy="0">Organiser les projets</tspan><tspan x="530.0" dy="20">destination de stockage</tspan></text>

<!-- 8. Connecter l'environnement distant -->
<ellipse cx="950.0" cy="701.0" rx="150.0" ry="41.0" fill="#FFFFFF" stroke="#405364" stroke-width="2"/>
<text x="950.0" y="697.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#17212B"><tspan x="950.0" dy="0">Connecter l'environnement distant</tspan><tspan x="950.0" dy="20">liaison réseau · diagnostic du worker</tspan></text>

<!-- Acteur primaire 1 (Humain) : Créateur de contenu -->
<circle cx="120" cy="442" r="10" fill="#FFFFFF" stroke="#17212B" stroke-width="2"/>
<line x1="120" y1="452" x2="120" y2="485" stroke="#17212B" stroke-width="2"/>
<line x1="102" y1="464" x2="138" y2="464" stroke="#17212B" stroke-width="2"/>
