coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%      # Échoue si le projet global descend sous les 90 %
        threshold: 0%    # Zéro tolérance
    patch:
      default:
        target: 100%     # Échoue si la moindre ligne modifiée dans la PR n'est pas testée
        threshold: 0%    # Zéro tolérance

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
