name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-validation:
    name: Backend Quality Gate (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi
          python -m pip install pytest ruff

      - name: Syntax & Lint Check
        run: |
          mapfile -d '' python_files < <(find . -type f -name "*.py" -not -path "*/.[!.]*/*" -print0)
          if (( ${#python_files[@]} > 0 )); then
            ruff check .
            python -m py_compile "${python_files[@]}"
          else
            echo "No Python files present yet."
          fi

      - name: Run Backend Tests
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path "*/.[!.]*/*" -print -quit | grep -q .; then
            pytest -q
          else
            echo "No Python test suite detected."
          fi

  frontend-validation:
    name: Frontend Quality Gate (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install & Validate Frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            else
              npm install
            fi
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "No frontend package.json present yet."
          fi

  hygiene-validation:
    name: Workflow & Security Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for validator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate GitHub Actions Invariants
        run: python3 .github/scripts/verify_workflows.py .github/workflows
