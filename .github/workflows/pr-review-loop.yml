name: PR Review Loop

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode d exécution'
        required: true
        default: 'summary'
        type: choice
        options:
          - summary
          - fix

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: review-loop-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    name: Synthèse des Revues
    if: github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'summary' || inputs.mode == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extraire les revues avec pr-review-fetcher
        id: fetcher
        uses: instructeur22/pr-review-fetcher@c533d804accdafd6d4c1b6cf09e3786fb9850cee # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: agent
          output-path: pr-reviews.xml

      - name: Publier la synthèse sur la PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENTS_COUNT: ${{ steps.fetcher.outputs.comments-count }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : (context.payload.issue ? context.payload.issue.number : null);
            if (!prNumber) return;
            const marker = '<!-- coding-stuff:pr-review-fetcher:summary -->';
            const count = process.env.COMMENTS_COUNT || '0';
            let body = `${marker}\n### 🔍 Synthèse des Revues de Code\n\n`;
            if (fs.existsSync('pr-reviews.xml')) {
              const xml = fs.readFileSync('pr-reviews.xml', 'utf8');
              const p0 = (xml.match(/<severity>P0<\/severity>/g) || []).length;
              const p1 = (xml.match(/<severity>P1<\/severity>/g) || []).length;
              const p2 = (xml.match(/<severity>P2<\/severity>/g) || []).length;
              const p3 = (xml.match(/<severity>P3<\/severity>/g) || []).length;
              body += `| Sévérité | Nombre |\n|---|:---:|\n| 🔴 P0 (Bloquant) | ${p0} |\n| 🟠 P1 (Critique) | ${p1} |\n| 🟡 P2 (Important) | ${p2} |\n| ⚪ P3 (Mineur) | ${p3} |\n\n**Total commentaires actifs :** ${count}\n\n`;
              if (parseInt(count, 10) > 0) {
                body += `> [!TIP]\n> Pour lancer la correction automatique des retours éligibles, commentez \`/fix-reviews\` sur cette PR.\n`;
              }
            }
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            }

      - name: Archiver le rapport XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-reviews-xml
          path: pr-reviews.xml
          retention-days: 7

  fix:
    name: Résolution Assistée
    if: (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/fix-reviews')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Vérifier les autorisations
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return;
            const assoc = context.payload.comment.author_association;
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowed.includes(assoc)) {
              core.setFailed(`Utilisateur non autorisé (${assoc}).`);
            }

      - name: Récupérer les informations de la PR
        id: pr_info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.issue ? context.payload.issue.number : context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('branch', pr.data.head.ref);
            core.setOutput('pr_number', prNumber);

      - name: Checkout de la branche PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr_info.outputs.branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Extraire les retours de revue
        id: fetcher
        uses: instructeur22/pr-review-fetcher@c533d804accdafd6d4c1b6cf09e3786fb9850cee # v1.0.0
        with:
          pr-number: ${{ steps.pr_info.outputs.pr_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          format: agent
          output-path: pr-reviews.xml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Exécuter la résolution Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Secret GEMINI_API_KEY non configuré."
            exit 1
          fi
          bun run "${{ github.action_path }}/src/gemini-resolver.ts" \
            --xml pr-reviews.xml \
            --instructions "${{ github.action_path }}/GEMINI.md" \
            --output-summary fix-summary.md

      - name: Commiter et pousser les correctifs
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(review): resolve CodeRabbit & Greptile review comments"
            git push origin HEAD:${{ steps.pr_info.outputs.branch }}
          fi
